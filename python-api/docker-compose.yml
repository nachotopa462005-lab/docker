services:

  backend:
    build: .
    ports:
      - "5000:5000"

    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    depends_on:
      - redis

    networks:
      - app-network


  redis:
    image: redis:latest

    command: redis-server --requirepass ${REDIS_PASSWORD}

    networks:
      - app-network


networks:
  app-network:
    driver: bridge